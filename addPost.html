<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Post - Uni Blog</title>
  <link rel="stylesheet" href="style/addPost.css">
</head>
<body>

  <!-- Same top bar as index.html -->
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="addPost.html">addPost</a>
    </nav>
    <span class="avatar"></span>
  </header>

  <main class="form-page">
    <!-- action="index.html" sends the user back to the home page on submit -->
    <form class="card" action="index.html" method="get">

      <div class="row">
        <label for="body">Post body</label>
        <textarea id="body" name="body" placeholder="textarea"></textarea>
      </div>

      <div class="row">
        <label for="file">Select file</label>
        <input type="file" id="file" name="file" accept="image/*">
      </div>

      <button type="submit" class="btn">Create post</button>

    </form>
  </main>

</body>
</html>
